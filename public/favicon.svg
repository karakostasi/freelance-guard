  <path d="M44.500 16.500c.7-2.500 2.200-4 3.500-3.500 1.200.5 1 3 .2 5z" fill="#ffb3c4"/>
  <!-- face -->
  <ellipse cx="46.500" cy="31" rx="5.500" ry="4.500" fill="#ffe6c8"/>
  <circle cx="44" cy="25.500" r="2.200" fill="#1b1e3a"/>
  <circle cx="44.800" cy="24.700" r=".8" fill="#fff"/>
  <circle cx="51" cy="29.500" r="1.800" fill="#1b1e3a"/>
