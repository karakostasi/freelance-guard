      <stop offset="1" stop-color="#b86d35"/>
    </linearGradient>
    <linearGradient id="tail" x1="8" y1="10" x2="30" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8692d"/>
      <stop offset="1" stop-color="#8c4719"/>
    </linearGradient>
    <linearGradient id="nut" x1="40" y1="40" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd966"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
